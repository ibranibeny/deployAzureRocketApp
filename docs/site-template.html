<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Install deployAzureRocketApp in VS Code. Learn its four agents, two skills and step-by-step Azure workload preparation workflow.">
  <meta name="referrer" content="no-referrer">
  <title>deployAzureRocketApp | Installation and Field Guide</title>
  <link rel="icon" href="data:,">
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
    * { box-sizing: border-box; }
    html { scroll-padding-top: 2rem; }
    body { margin: 0; background: var(--cp-surface); color: var(--cp-text); font: 16px/1.7 "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: 0; }
    a { color: var(--cp-link); text-underline-offset: 3px; overflow-wrap: anywhere; }
    a:hover { color: var(--cp-accent-hover); }
    :focus-visible { outline: 3px solid var(--cp-accent); outline-offset: 4px; }
    ::selection { background: var(--cp-highlight); }
    .skip { position: absolute; left: 1rem; top: -5rem; background: var(--cp-surface); padding: .5rem 1rem; z-index: 3; }
    .skip:focus { top: 1rem; }
    .masthead { border-top: 5px solid var(--cp-accent); border-bottom: 1px solid var(--cp-border); background: var(--cp-surface-soft); }
    .masthead-inner { max-width: 1320px; margin: auto; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem 2rem; flex-wrap: wrap; }
    .brand { color: var(--cp-text); font-size: 18px; font-weight: 650; text-decoration: none; }
    .header-links { display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap; font-size: 14px; }
    .header-links a { font-weight: 600; }
    select { background: var(--cp-surface); color: var(--cp-text); border: 1px solid var(--cp-border-strong); border-radius: 4px; font: inherit; padding: .4rem; }
    .layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 4rem; max-width: 1240px; margin: auto; padding: 3rem 2rem 6rem; }
    aside { min-width: 0; }
    .contents { position: sticky; top: 2rem; max-height: calc(100vh - 4rem); overflow-y: auto; padding: 0 1rem 1rem 0; }
    summary { color: var(--cp-text-muted); font-size: 14px; font-weight: 650; cursor: pointer; }
    .contents nav { margin-top: 1rem; display: grid; gap: .35rem; }
    .contents nav a { color: var(--cp-text-muted); text-decoration: none; font-size: 14px; padding: .5rem .75rem; border-left: 2px solid var(--cp-border); }
    .contents nav a:hover, .contents nav a[aria-current="location"] { color: var(--cp-accent); border-color: var(--cp-accent); background: var(--cp-accent-soft); }
    .contents footer { border-top: 1px solid var(--cp-border); margin-top: 1.5rem; padding-top: 1rem; font-size: 12px; color: var(--cp-text-muted); }
    main { min-width: 0; max-width: 850px; }
    article { overflow-wrap: anywhere; }
    article img { display: block; max-width: 100%; height: auto; border: 1px solid var(--cp-border); border-radius: 4px; margin: 1.5rem 0 .75rem; }
    article p:has(> a > img) + p { color: var(--cp-text-muted); font-size: 13px; line-height: 1.6; }
    h1, h2, h3 { line-height: 1.22; font-weight: 650; color: var(--cp-text); }
    h1 { font-size: 36px; margin: 0 0 1rem; }
    h2 { font-size: 26px; margin: 3.5rem 0 1.5rem; padding-top: 2rem; border-top: 1px solid var(--cp-border); }
    h3 { font-size: 20px; margin: 2rem 0 1rem; }
    p { margin: 0 0 1.15rem; }
    li { margin-bottom: .6rem; }
    code, pre { font-family: Consolas, "Courier New", Courier, monospace; font-size: 14px; }
    :not(pre) > code { padding: .12rem .28rem; background: var(--cp-surface-soft); border-radius: 3px; }
    pre { margin: 1.5rem 0; padding: 1.25rem; border-left: 3px solid var(--cp-border-strong); background: var(--cp-surface-soft); white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.6; }
    .table-scroll { max-width: 100%; overflow-x: auto; margin: 1.5rem 0; }
    table { width: 100%; min-width: 520px; border-collapse: collapse; font-size: 14px; line-height: 1.55; }
    th, td { padding: .9rem .8rem; text-align: left; vertical-align: top; border-bottom: 1px solid var(--cp-border); }
    th { background: var(--cp-surface-soft); color: var(--cp-text); font-weight: 650; }
    .workflow { margin: 2rem 0; }
    .workflow-visual { overflow-x: auto; }
    .workflow-visual svg { display: block; min-width: 500px; width: 100%; height: auto; margin: auto; }
    .workflow figcaption { color: var(--cp-text-muted); font-size: 13px; margin-top: .7rem; }
    .workflow pre { white-space: pre; overflow: auto; }
    .endnote { color: var(--cp-text-muted); font-size: 13px; margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--cp-border); }
    @media (max-width: 800px) {
      .layout { grid-template-columns: minmax(0, 1fr); padding: 1.5rem 1rem 4rem; gap: 2rem; }
      .masthead-inner { padding: 1rem; }
      .header-links { gap: 1rem; }
      .contents { position: static; max-height: none; border-bottom: 1px solid var(--cp-border); padding-bottom: 1rem; }
      .contents footer { display: none; }
      h1 { font-size: 27px; }
      h2 { font-size: 23px; }
      h3 { font-size: 19px; }
      pre { padding: 1rem; font-size: 13px; }
    }
    @media print {
      aside, .masthead, .skip, .endnote { display: none; }
      .layout { display: block; padding: 0; }
      main { max-width: none; }
      .table-scroll { overflow: visible; }
      h2, h3 { break-after: avoid; }
      pre, tr { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#guide">Skip to guide</a>
  <header class="masthead">
    <div class="masthead-inner">
      <a class="brand" href="#guide">Azure Rocket / Field Guide</a>
      <nav class="header-links" aria-label="Repository">
        <a href="https://github.com/ibranibeny/deployAzureRocketApp">GitHub</a>
        <a href="https://github.com/ibranibeny/deployAzureRocketApp/archive/refs/heads/main.zip">Download package</a>
        <select id="theme" aria-label="Color theme">
          <option value="system">System theme</option>
          <option value="light">Light theme</option>
          <option value="dark">Dark theme</option>
        </select>
      </nav>
    </div>
  </header>
  <div class="layout">
    <aside>
      <details class="contents" open>
        <summary>Contents</summary>
        <nav aria-label="Chapters">@@NAVIGATION@@</nav>
        <footer>4 operational agents<br>2 bundled skills<br>Setup: VS Code, Copilot app, CLI</footer>
      </details>
    </aside>
    <main id="guide" tabindex="-1">
      <article>@@GUIDE_CONTENT@@</article>
      <footer class="endnote">Documentation edition 16 September 2026. <a href="https://github.com/ibranibeny/deployAzureRocketApp/blob/main/docs/guide.md">Read the Markdown source</a>.</footer>
    </main>
  </div>
  <script>
    (() => {
      const media = window.matchMedia("(prefers-color-scheme: dark)");
      const themeSelect = document.querySelector("#theme");
      const queryTheme = new URLSearchParams(location.search).get("scoutTheme");
      themeSelect.value = ["light", "dark"].includes(queryTheme) ? queryTheme : "system";
      const applyTheme = () => {
        document.documentElement.dataset.theme = themeSelect.value === "system"
          ? (media.matches ? "dark" : "light") : themeSelect.value;
      };
      themeSelect.addEventListener("change", applyTheme);
      media.addEventListener("change", applyTheme);
      applyTheme();
      const contents = document.querySelector(".contents");
      if (window.matchMedia("(max-width: 800px)").matches) contents.open = false;
      const links = [...document.querySelectorAll('[aria-label="Chapters"] a')];
      links.forEach(link => link.addEventListener("click", () => {
        if (window.matchMedia("(max-width: 800px)").matches) contents.open = false;
      }));
      if ("IntersectionObserver" in window) {
        const observer = new IntersectionObserver(entries => {
          entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            links.forEach(link => {
              if (link.hash === `#${entry.target.id}`) link.setAttribute("aria-current", "location");
              else link.removeAttribute("aria-current");
            });
          });
        }, { rootMargin: "-5% 0px -70% 0px" });
        document.querySelectorAll("article h2").forEach(heading => observer.observe(heading));
      }
      document.querySelectorAll("article table").forEach((table, index) => {
        const region = document.createElement("div");
        region.className = "table-scroll";
        region.tabIndex = 0;
        region.setAttribute("role", "region");
        region.setAttribute("aria-label", `Reference table ${index + 1}`);
        table.before(region);
        region.append(table);
      });
    })();
  </script>
  <script type="module">
    const source = document.querySelector("pre.mermaid");
    if (source) {
      const figure = document.createElement("figure");
      figure.className = "workflow";
      const visual = document.createElement("div");
      visual.className = "workflow-visual";
      visual.tabIndex = 0;
      visual.setAttribute("role", "region");
      visual.setAttribute("aria-label", "Agent workflow diagram");
      const caption = document.createElement("figcaption");
      caption.textContent = "Rendering workflow. The source remains below.";
      caption.setAttribute("role", "status");
      source.before(figure);
      figure.append(visual, caption, source);
      try {
        const { default: mermaid } = await import("https://cdn.jsdelivr.net/npm/mermaid@11.12.0/dist/mermaid.esm.min.mjs");
        mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: "neutral", flowchart: { htmlLabels: false } });
        const result = await mermaid.render("agent-workflow", source.textContent);
        visual.innerHTML = result.svg;
        caption.textContent = "Figure 1. Source learning, approval, execution and evidence ownership.";
        const details = document.createElement("details");
        const summary = document.createElement("summary");
        summary.textContent = "Mermaid source";
        figure.append(details);
        details.append(summary, source);
      } catch {
        caption.textContent = "The diagram renderer is unavailable. Read the workflow source below.";
      }
    }
  </script>
</body>
</html>
